indicadores.index:
  path: '/indicadores'
  defaults:
    _title: 'Relatórios'
    _controller: '\Drupal\indicadores\Controller\IndexController::index'
  requirements:
    _permission: 'access administration pages'

## Início rotas para relatório de capacitação ##
indicadores.capacitacao:
  path: '/indicadores/capacitacao'
  defaults:
    _title: 'Relatórios de Capacitações'
    _controller: '\Drupal\indicadores\Controller\CapacitacaoController::index'
  requirements:
    _permission: 'access administration pages'
    
indicadores.capacitacao_excel:
  path: '/indicadores/capacitacao/{webform_id}/excel'
  defaults:
    _controller: '\Drupal\indicadores\Controller\CapacitacaoController::excel'
  requirements:
    _permission: 'access administration pages'

indicadores.capacitacao_pdf:
  path: '/indicadores/capacitacao/{webform_id}/pdf'
  defaults:
    _controller: '\Drupal\indicadores\Controller\CapacitacaoController::pdf'
  requirements:
    _permission: 'access administration pages'

## Início rotas para relatório de Dados Administrativos - Estrutura Organizacional ##
indicadores.estrutura_organizacional:
  path: '/indicadores/estrutura_organizacional'
  defaults:
    _title: 'Relatório Estrutura Organizacional'
    _controller: '\Drupal\indicadores\Controller\EstruturaOrganizacionalController::index'
  requirements:
    _permission: 'access administration pages'
    
indicadores.estrutura_organizacional_excel:
  path: '/indicadores/estrutura_organizacional/{webform_id}/excel'
  defaults:
    _controller: '\Drupal\indicadores\Controller\EstruturaOrganizacionalController::excel'
  requirements:
    _permission: 'access administration pages'

indicadores.estrutura_organizacional_pdf:
  path: '/indicadores/estrutura_organizacional/{webform_id}/pdf'
  defaults:
    _controller: '\Drupal\indicadores\Controller\EstruturaOrganizacionalController::pdf'
  requirements:
    _permission: 'access administration pages'


