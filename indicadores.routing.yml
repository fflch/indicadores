indicadores.index:
  path: '/indicadores'
  defaults:
    _title: 'Relatórios'
    _controller: '\Drupal\indicadores\Controller\IndexController::index'
  requirements:
    _permission: 'access administration pages'

## Início rotas para relatório de capacitação ##
